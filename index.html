<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avinash Kori Games</title>
<meta name="description" content="Mobile games by Avinash Kori.">
<style>
  :root { --bg: #ffffff; --fg: #1d1b2e; --muted: #5d5a73; --accent: #5b3fd6; --line: #e4e1f0; --card: #f6f4fc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14122a; --fg: #ecebf5; --muted: #a9a6c2; --accent: #a996ff; --line: #2c2948; --card: #1c1a36; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 { font-size: 2rem; margin: 0 0 4px; }
  .meta { color: var(--muted); margin: 0 0 32px; }
  .game { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .game h2 { margin: 0 0 4px; font-size: 1.2rem; }
  .game p { margin: 0 0 10px; color: var(--muted); }
  a { color: var(--accent); }
  footer { margin-top: 48px; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<main>
  <h1>Avinash Kori Games</h1>
  <p class="meta">Relaxing puzzle games for Android. Contact: <a href="mailto:koriavinash00@gmail.com">koriavinash00@gmail.com</a></p>

  <div class="game">
    <h2>Ball Sort Magic - Color Game</h2>
    <p>Sort glowing balls into tubes across magical worlds. No forced ads.</p>
    <a href="ballsortmagic/privacy.html">Privacy policy</a>
  </div>

  <footer>© 2026 Avinash Kori</footer>
</main>
</body>
</html>
